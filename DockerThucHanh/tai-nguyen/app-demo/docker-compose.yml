# docker-compose.yml — môi trường DEV
# Chạy:  docker compose up -d
# Xem:   docker compose ps
# Dừng:  docker compose down

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DB_HOST: db
      DB_NAME: ${DB_NAME:-appdb}
      DB_USER: ${DB_USER:-appuser}
      DB_PASSWORD: ${DB_PASSWORD:?Thieu DB_PASSWORD - hay tao file .env}
      REDIS_HOST: cache
    volumes:
      # Gắn code từ máy vào container: sửa code là thấy ngay, không cần build lại
      - ./:/app
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    restart: unless-stopped
    # Dev: bật auto-reload khi sửa code
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-appdb}
      POSTGRES_USER: ${DB_USER:-appuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Thieu DB_PASSWORD}
    volumes:
      # Named volume: dữ liệu CÒN sau khi container bị xoá
      - du-lieu-postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-appuser} -d ${DB_NAME:-appdb}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    volumes:
      - du-lieu-redis:/data
    restart: unless-stopped

volumes:
  du-lieu-postgres:
  du-lieu-redis:
